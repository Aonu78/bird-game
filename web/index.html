<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bird Game - Landscape Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #030712;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Main Fullscreen Landscape Stage */
    main {
      flex: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      position: relative;
    }
    .viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * 16 / 9);
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    /* Screen Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      transition: opacity 0.2s ease;
    }
    .hidden { display: none !important; opacity: 0; }

    /* Crash Game Over Screen */
    .crash-card {
      background: #0f172a;
      border: 2px solid rgba(239, 68, 68, 0.5);
      border-radius: 24px;
      padding: 28px 36px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.9), 0 0 40px -10px rgba(239, 68, 68, 0.3);
      position: relative;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .crash-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .crash-title {
      font-size: 34px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .score-banner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 20px 0;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }
    .score-block { text-align: center; }
    .score-block .num {
      font-size: 40px;
      font-weight: 900;
      font-family: monospace;
      color: #38bdf8;
      line-height: 1;
    }
    .score-block .num.best { color: #f59e0b; }
    .score-block .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }
    .btn-action {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      transition: all 0.15s;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 10px 25px -4px rgba(2, 132, 199, 0.6);
    }
    .btn-action:hover {
      background: linear-gradient(135deg, #38bdf8, #1d4ed8);
      transform: translateY(-1px);
    }
    .btn-action:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Main Fullscreen 16:9 Landscape Screen -->
    <main>
      <div class="viewport-container">
        <canvas id="gameCanvas" width="1920" height="1080"></canvas>

        <!-- ============================================ -->
        <!-- CRASH / GAME OVER OVERLAY -->
        <!-- ============================================ -->
        <div id="crashOverlay" class="overlay hidden">
          <div class="crash-card">
            <div class="crash-badge">⚡ Impact Detected</div>
            <h2 class="crash-title">CRASH! GAME OVER</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-top: 6px;">
              The bird collided with an obstacle. Ready for another flight?
            </p>

            <div class="score-banner">
              <div class="score-block">
                <div class="num" id="crashScore">0</div>
                <div class="label">Flight Score</div>
              </div>
              <div class="score-block">
                <div class="num best" id="crashBest">0</div>
                <div class="label">Best Record</div>
              </div>
            </div>

            <button id="retryBtn" class="btn-action">
              <span>🔄</span> RETRY RUN (Press Space / Tap)
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const VIRTUAL_W = 1920;
    const VIRTUAL_H = 1080;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'PLAYING'; // PLAYING, CRASH
    let score = 0;
    let highScore = parseInt(localStorage.getItem('birdgame_highscore') || '0', 10);
    let soundOn = true;

    // Sound Synthesizer
    let audioCtx = null;
    function playSfx(type) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (type === 'flap') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.13);
        } else if (type === 'score') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.26);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.19);
        }
      } catch(e) {}
    }

    // Asset Textures
    const avatarImg = new Image(); avatarImg.src = '/avatar.png';
    const obsImg = new Image(); obsImg.src = '/obstacle.png';
    let obsPattern = null;

    // Bird Engine
    const bird = {
      x: VIRTUAL_W * 0.2,
      y: VIRTUAL_H * 0.15,
      vy: 0,
      angle: 0,
      frame: 1,
      flapUntil: 0
    };

    let obstacles = [];
    let cameraX = 0;
    let nextId = 1;
    let lastTime = performance.now();

    function spawnObstacles() {
      const gap = 360;
      const lastObs = obstacles[obstacles.length - 1];
      let startX = lastObs ? lastObs.x + 120 + 350 : VIRTUAL_W * 0.7;
      while (startX < cameraX + VIRTUAL_W * 1.5) {
        const gapY = Math.floor(Math.random() * (1080 - 150 - gap - 150) + 150);
        obstacles.push({ id: nextId++, x: startX, gapY, gapH: gap, passed: false });
        startX += 120 + 350;
      }
      obstacles = obstacles.filter(o => o.x + 120 > cameraX - 250);
    }

    function resetGame() {
      score = 0;
      bird.x = VIRTUAL_W * 0.2;
      bird.y = VIRTUAL_H * 0.15;
      bird.vy = 0;
      bird.angle = 0;
      cameraX = 0;
      obstacles = [];
      spawnObstacles();
      gameState = 'PLAYING';
      lastTime = performance.now();
      document.getElementById('crashOverlay').classList.add('hidden');
      playSfx('flap');
    }

    function showCrash() {
      gameState = 'CRASH';
      playSfx('hit');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('birdgame_highscore', highScore.toString());
      }

      document.getElementById('crashScore').textContent = score;
      document.getElementById('crashBest').textContent = highScore;
      document.getElementById('crashOverlay').classList.remove('hidden');
    }

    function flap() {
      if (gameState === 'CRASH') {
        resetGame();
        return;
      }
      bird.vy = -840;
      bird.flapUntil = performance.now() + 240;
      playSfx('flap');
    }

    // Event Listeners
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault(); flap();
      } else if (e.code === 'KeyR' && gameState === 'CRASH') {
        resetGame();
      }
    });

    canvas.addEventListener('click', flap);
    document.getElementById('retryBtn').addEventListener('click', resetGame);

    // Animation Render Loop
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!obsPattern && obsImg.complete) {
        obsPattern = ctx.createPattern(obsImg, 'repeat');
      }

      if (gameState === 'PLAYING') {
        bird.x += 440 * dt;
        cameraX = bird.x - VIRTUAL_W * 0.2;

        bird.vy += 2200 * dt;
        bird.y += bird.vy * dt;

        if (now < bird.flapUntil) {
          bird.frame = (Math.floor(now / 70) % 2);
          bird.angle = -0.38;
        } else {
          bird.frame = 1;
          const targetAngle = Math.min(Math.PI / 2.7, (bird.vy / 800) * 0.95);
          bird.angle += (targetAngle - bird.angle) * 0.12;
        }

        spawnObstacles();

        // Floor / Ceiling
        if (bird.y - 55 <= 0 || bird.y + 55 >= VIRTUAL_H - 60) {
          showCrash();
        }

        // Obstacles collision
        for (const obs of obstacles) {
          if (!obs.passed && bird.x > obs.x + 120) {
            obs.passed = true;
            score++;
            playSfx('score');
          }
          if (bird.x + 55 > obs.x && bird.x - 55 < obs.x + 120) {
            if (bird.y - 55 < obs.gapY || bird.y + 55 > obs.gapY + obs.gapH) {
              showCrash();
              break;
            }
          }
        }
      }

      // Render Stage
      ctx.save();
      const grad = ctx.createLinearGradient(0, 0, 0, VIRTUAL_H);
      grad.addColorStop(0, '#E8FFFF');
      grad.addColorStop(0.7, '#CBE8FA');
      grad.addColorStop(1, '#A8D5F4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VIRTUAL_W, VIRTUAL_H);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      for (let i = -1; i < 6; i++) {
        const cx = ((i * 500 - cameraX * 0.15) % (VIRTUAL_W + 500) + VIRTUAL_W + 500) % (VIRTUAL_W + 500) - 200;
        ctx.beginPath();
        ctx.arc(cx, 180 + (i % 3) * 60, 90, 0, Math.PI * 2);
        ctx.arc(cx + 70, 150 + (i % 3) * 60, 110, 0, Math.PI * 2);
        ctx.arc(cx + 150, 180 + (i % 3) * 60, 80, 0, Math.PI * 2);
        ctx.fill();
      }

      // Obstacle Pillars
      for (const obs of obstacles) {
        const dx = obs.x - cameraX;
        if (dx + 120 < -50 || dx > VIRTUAL_W + 50) continue;

        // Top
        if (obsPattern) {
          ctx.fillStyle = obsPattern;
          ctx.fillRect(dx, 0, 120, obs.gapY);
        } else {
          ctx.fillStyle = '#15803d';
          ctx.fillRect(dx, 0, 120, obs.gapY);
        }
        ctx.strokeStyle = '#14532d';
        ctx.lineWidth = 4;
        ctx.strokeRect(dx, 0, 120, obs.gapY);

        // Flange cap top
        ctx.fillStyle = '#166534';
        ctx.fillRect(dx - 6, obs.gapY - 32, 132, 32);

        // Bottom
        const by = obs.gapY + obs.gapH;
        const bh = VIRTUAL_H - 60 - by;
        if (obsPattern) {
          ctx.fillStyle = obsPattern;
          ctx.fillRect(dx, by, 120, bh);
        } else {
          ctx.fillStyle = '#15803d';
          ctx.fillRect(dx, by, 120, bh);
        }
        ctx.strokeRect(dx, by, 120, bh);

        // Flange cap bottom
        ctx.fillStyle = '#166534';
        ctx.fillRect(dx - 6, by, 132, 32);
      }

      // Ground
      ctx.fillStyle = '#65a30d';
      ctx.fillRect(0, VIRTUAL_H - 60, VIRTUAL_W, 14);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, VIRTUAL_H - 46, VIRTUAL_W, 46);

      // Bird
      const bx = bird.x - cameraX;
      ctx.save();
      ctx.translate(bx, bird.y);
      ctx.rotate(bird.angle);
      if (avatarImg.complete && avatarImg.naturalWidth > 0) {
        const sx = bird.frame * 170;
        ctx.drawImage(avatarImg, sx, 0, 170, 170, -90, -90, 180, 180);
      } else {
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      // Top In-game HUD
      ctx.font = 'bold 50px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(`SCORE: ${score}`, VIRTUAL_W - 80, 95);

      ctx.font = 'bold 28px sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText(`BEST: ${highScore}`, VIRTUAL_W - 80, 140);

      // Tap / Spacebar hint at the start
      if (score === 0 && gameState === 'PLAYING') {
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
        ctx.fillText('TAP OR PRESS SPACEBAR TO JUMP', VIRTUAL_W / 2, VIRTUAL_H - 120);
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
